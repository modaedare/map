const map=L.map('map');
const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:19,
  attribution:'Tiles © Esri'
});
esri.addTo(map);
const markers=L.layerGroup().addTo(map);
const stages=[...new Set(data.features.map(f=>f.properties.stage).filter(Boolean))].sort();
const stageSel=document.getElementById('stage');
stages.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;stageSel.appendChild(o)});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function refresh(){
 markers.clearLayers();
 const q=document.getElementById('q').value.trim().toLowerCase(), st=stageSel.value, ge=document.getElementById('gender').value;
 let shown=0;
 data.features.forEach(f=>{
  const p=f.properties;
  if(st && p.stage!==st) return;
  if(ge && p.gender!==ge) return;
  if(q && !(p.name+' '+p.address+' '+p.stage).toLowerCase().includes(q)) return;
  const popup=`<b>${esc(p.name)}</b><br>مقطع: ${esc(p.stage)}<br>جنسیت: ${esc(p.gender)}<br>نوع: ${esc(p.kind)}<br>تلفن: ${esc(p.tel||'ثبت نشده')}<br>نشانی: ${esc(p.address||'ثبت نشده')}<br>شناسه: ${esc(p.id)}`;
  L.marker([f.geometry.coordinates[1],f.geometry.coordinates[0]]).bindPopup(popup).addTo(markers);
  shown++;
 });
 document.getElementById('count').textContent='نمایش '+shown+' مدرسه از '+data.features.length+' مورد';
}
['q','stage','gender'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',refresh));
refresh();
if(data.features.length){const bounds=L.latLngBounds(data.features.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]]));map.fitBounds(bounds.pad(0.08));}
